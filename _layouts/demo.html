---
layout: default
---
<div class="demo-page">
  <div class="demo-breadcrumb">
    <a href="{{ '/' | relative_url }}">Índice</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Módulo {{ page.module }} &middot; {{ page.module_title }}</span>
  </div>

  <header class="demo-header">
    {% if page.eyebrow %}<p class="demo-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="demo-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="demo-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  {{ content }}

  {% include demo-nav.html %}
</div>
